name: ${COMPOSE_PROJECT_NAME:-recycling-incentive}

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recycling_incentive_backend}
      POSTGRES_USER: ${POSTGRES_USER:-recycling_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recycling_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      target: development
    restart: unless-stopped
    environment:
      APP_NAME: ${BACKEND_APP_NAME:-Recycling Incentive API}
      APP_ENV: ${BACKEND_APP_ENV:-local}
      APP_KEY: ${BACKEND_APP_KEY:-}
      APP_DEBUG: ${BACKEND_APP_DEBUG:-true}
      APP_URL: ${BACKEND_APP_URL:-http://localhost:8000}
      APP_LOCALE: ${BACKEND_APP_LOCALE:-en}
      APP_FALLBACK_LOCALE: ${BACKEND_APP_FALLBACK_LOCALE:-en}
      LOG_CHANNEL: ${BACKEND_LOG_CHANNEL:-stack}
      LOG_STACK: ${BACKEND_LOG_STACK:-single}
      LOG_LEVEL: ${BACKEND_LOG_LEVEL:-debug}
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-recycling_incentive_backend}
      DB_USERNAME: ${POSTGRES_USER:-recycling_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-recycling_password}
      SESSION_DRIVER: ${BACKEND_SESSION_DRIVER:-database}
      SESSION_DOMAIN: ${BACKEND_SESSION_DOMAIN:-null}
      SESSION_SECURE_COOKIE: ${BACKEND_SESSION_SECURE_COOKIE:-false}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost,localhost:5173,127.0.0.1,127.0.0.1:5173,localhost:8000,127.0.0.1:8000,::1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081,http://127.0.0.1:8081}
      CORS_ALLOWED_ORIGINS_PATTERNS: ${CORS_ALLOWED_ORIGINS_PATTERNS:-}
      CACHE_STORE: ${BACKEND_CACHE_STORE:-database}
      QUEUE_CONNECTION: ${BACKEND_QUEUE_CONNECTION:-database}
      MAIL_MAILER: ${BACKEND_MAIL_MAILER:-log}
      RUN_MIGRATIONS: ${BACKEND_RUN_MIGRATIONS:-true}
      RUN_SEEDERS: ${BACKEND_RUN_SEEDERS:-true}
      WAIT_FOR_DB: ${BACKEND_WAIT_FOR_DB:-true}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@recycling.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-password}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-user@recycling.com}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-password}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - .:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@file_get_contents('http://127.0.0.1:8000/api/ping') === false ? 1 : 0);\""]
      interval: 10s
      timeout: 5s
      retries: 12

  admin-frontend:
    build:
      context: ../recycling-incentive-app-admin-frontend
      target: development
    restart: unless-stopped
    environment:
      VITE_API_URL: ${ADMIN_VITE_API_URL:-http://localhost:8000}
      CHOKIDAR_USEPOLLING: ${ADMIN_CHOKIDAR_USEPOLLING:-true}
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    ports:
      - "${ADMIN_FRONTEND_PORT:-5173}:5173"
    volumes:
      - ../recycling-incentive-app-admin-frontend:/app
      - admin_frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

  expo:
    build:
      context: ../recycling-incentive-app-expo
      target: development
    restart: unless-stopped
    environment:
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:8000/api}
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      EXPO_NO_DOTENV: 1
      EXPO_NO_TELEMETRY: 1
      REACT_NATIVE_PACKAGER_HOSTNAME: ${EXPO_PACKAGER_HOSTNAME:-localhost}
      CHOKIDAR_USEPOLLING: ${EXPO_CHOKIDAR_USEPOLLING:-true}
      WATCHPACK_POLLING: ${EXPO_WATCHPACK_POLLING:-true}
    command: ["npm", "run", "start", "--", "--host", "lan", "--clear"]
    ports:
      - "${EXPO_METRO_PORT:-8081}:8081"
      - "${EXPO_PORT_19000:-19000}:19000"
      - "${EXPO_PORT_19001:-19001}:19001"
      - "${EXPO_PORT_19002:-19002}:19002"
    volumes:
      - ../recycling-incentive-app-expo:/app
      - expo_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  backend_vendor:
  admin_frontend_node_modules:
  expo_node_modules:
